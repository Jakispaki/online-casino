    <title>Royal Ace Casino</title>
    
    <!-- Unser neues Design -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>
<body>

    <!-- NEUE NAVBAR -->
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="navbar-brand brand-font">
            ♠ Royal Ace
        </a>

        <div class="nav-links">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('index') }}">Lobby</a>
                <a href="{{ url_for('blackjack') }}">Blackjack</a>
                <a href="{{ url_for('roulette') }}">Roulette</a>
                <a href="{{ url_for('lucky_wheel') }}">Lucky Wheel</a>
                <a href="{{ url_for('stats') }}">Stats</a>
            {% endif %}
        </div>

        <div class="nav-user">
            {% if current_user.is_authenticated %}
                <!-- Das Guthaben wird später dynamisch geladen, wir zeigen vorerst einen Platzhalter -->
                <div class="balance-pill" id="nav-balance">
                    ${{ "%.2f"|format(global_balance) }}
                </div>
                <a href="{{ url_for('deposit') }}" class="btn btn-primary" style="padding: 8px 16px; font-size: 14px;">Einzahlen</a>
                <a href="{{ url_for('settings') }}" style="color: var(--text-main); font-size: 20px;">⚙️</a>
                <a href="{{ url_for('logout') }}" class="btn btn-outline" style="padding: 8px 16px; font-size: 14px; border-color: var(--danger); color: var(--danger);">Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}" class="btn btn-outline" style="padding: 8px 16px;">Login</a>
                <a href="{{ url_for('register') }}" class="btn btn-primary" style="padding: 8px 16px;">Registrieren</a>
            {% endif %}
        </div>
    </nav>

    <!-- HAUPTINHALT -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

      function applyLanguage(lang) {
        const dict = translations[lang] || translations.en;
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const key = el.getAttribute('data-i18n');
          if (dict[key]) {
            el.textContent = dict[key];
          }
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
          const key = el.getAttribute('data-i18n-placeholder');
          if (dict[key]) {
            el.setAttribute('placeholder', dict[key]);
          }
        });
        document.querySelectorAll('[data-i18n-html]').forEach((el) => {
          const key = el.getAttribute('data-i18n-html');
          if (dict[key]) {
            el.innerHTML = dict[key];
          }
        });
        window.currentLang = lang;
        window.currentDict = dict;
        localStorage.setItem('lang', lang);
        document.dispatchEvent(new CustomEvent('languageChanged', { detail: { lang } }));
      }

      // Wir erstellen den Sprachwähler dynamisch in der Navbar, falls er gebraucht wird
      // (Dieser Teil bleibt vorerst so, funktioniert aber mit dem neuen Design)
      function getTranslation(key, fallback) {
        if (window.currentDict && window.currentDict[key]) {
          return window.currentDict[key];
        }
        return fallback || key;
      }
      window.getTranslation = getTranslation;

      // Initiale Sprache laden
      const savedLang = localStorage.getItem('lang') || 'en';
      applyLanguage(savedLang);
    </script>
