{% extends "base.html" %}

{% block content %}
<style>
  /* Tisch-spezifisches Design */
  .table-area {
    margin: 40px auto;
    max-width: 800px;
    background: var(--green-felt);
    border: 2px solid #1f3b2c;
    border-radius: 22px;
    padding: 30px;
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.5), 0 15px 35px rgba(0,0,0,0.6);
  }
  .table-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #cfe7d9;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 15px;
  }
  .bet-panel {
    background: rgba(11, 17, 34, 0.8);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 30px;
    text-align: center;
  }
  .bet-panel label {
    font-size: 15px;
    color: var(--text-main);
    font-weight: 600;
    margin-right: 10px;
  }
  .bet-panel .form-control {
    max-width: 150px;
    display: inline-block;
    margin-right: 10px;
  }
  .card-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin: 15px 0;
    justify-content: center;
  }
  .hand-label {
    font-size: 16px;
    color: var(--gold);
    margin-top: 20px;
    margin-bottom: 5px;
    font-weight: 700;
    text-align: center;
  }
  .card {
    width: 70px;
    height: 100px;
    border-radius: 10px;
    background: #f7f7fb;
    color: #121212;
    border: 2px solid #0b0f1f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 22px;
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
    transition: transform 0.3s ease;
  }
  .card.red { color: var(--red-suit); }
  .card.hidden {
    background: linear-gradient(135deg, #1c2a6b, #101738);
    border-color: #0a0f2c;
    color: transparent;
  }
  .hand-value {
    color: var(--text-main);
    font-weight: 700;
    text-align: center;
    font-size: 16px;
  }
  .status-area {
    margin-top: 25px;
    text-align: center;
  }
  .status-badge {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 20px;
    background: rgba(15, 22, 43, 0.9);
    border: 1px solid var(--gold);
    color: var(--gold);
    box-shadow: 0 0 20px rgba(240, 192, 97, 0.3);
  }
  .action-bar {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 15px;
  }
  .btn-hit { background: var(--success); color: #fff; }
  .btn-hit:hover { background: #3cb371; transform: translateY(-2px); }
  .btn-stand { background: var(--gold); color: #111; }
  .btn-stand:hover { background: var(--gold-hover); transform: translateY(-2px); }
  .btn-again { background: #1f4aa8; color: #fff; width: 100%; margin-top: 20px; }
  
  /* Tutorial Overlay */
  .tutorial-overlay {
    position: fixed;
    inset: 0;
    background: rgba(3, 4, 7, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }
  .tutorial-card {
    background: var(--card-bg);
    border: 1px solid var(--gold);
    border-radius: 14px;
    padding: 30px;
    max-width: 450px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
  }
  .tutorial-card h3 { margin-top: 0; font-size: 24px; color: var(--gold); }
  .tutorial-actions { margin-top: 20px; display: flex; justify-content: center; gap: 10px; }
</style>

<div class="table-area">
    <div class="table-header">
        <span data-i18n="blackjack.table">Blackjack-Tisch</span>
        <span data-i18n="blackjack.rule">Dealer bleibt bei 17 stehen</span>
        <button class="btn btn-outline" id="tutorial-btn" type="button" data-i18n="tutorial.button" style="padding: 5px 10px; font-size: 12px;">Tutorial</button>
    </div>

    <!-- BET SECTION -->
    <div id="bet-section" class="bet-panel">
      <label for="bet" data-i18n="blackjack.bet">Einsatz ($)</label>
      <input type="number" class="form-control" id="bet" value="10" min="1" step="10">
      <button class="btn btn-primary" onclick="startGame()" data-i18n="blackjack.deal">Karten geben</button>
    </div>

    <!-- GAME SECTION -->
    <div id="game-section" style="display: none;">
      <div class="hand-label" data-i18n="blackjack.dealer">Dealer</div>
      <div id="dealer-cards" class="card-row"></div>
      <div class="hand-value"><span data-i18n="blackjack.value">Wert</span>: <span id="dealer-value">?</span></div>

      <div class="hand-label" data-i18n="blackjack.player" style="margin-top: 40px;">Spieler</div>
      <div id="player-cards" class="card-row"></div>
      <div class="hand-value"><span data-i18n="blackjack.value">Wert</span>: <span id="player-value">0</span></div>

      <div id="game-status" class="status-area"></div>

      <div id="action-buttons" class="action-bar">
        <button class="btn btn-hit" onclick="playerHit()" data-i18n="blackjack.hit">Karte</button>
        <button class="btn btn-stand" onclick="playerStand()" data-i18n="blackjack.stand">Halten</button>
      </div>

      <div id="play-again" style="display: none;">
        <button class="btn btn-again" onclick="location.reload()" data-i18n="blackjack.again">Nochmal spielen</button>
      </div>
    </div>
</div>

<!-- TUTORIAL OVERLAY -->
<div class="tutorial-overlay" id="tutorial-overlay" data-show="{{ 'true' if show_tutorial else 'false' }}">
  <div class="tutorial-card">
    <h3 id="tutorial-title" data-i18n="blackjack.tutorialTitle">Willkommen bei Blackjack</h3>
    <p id="tutorial-text">Wähle deinen Einsatz und drücke Karten geben zum Starten.</p>
    <div class="tutorial-actions">
      <button class="btn btn-outline" id="tutorial-close" data-i18n="tutorial.close">Schließen</button>
      <button class="btn btn-primary" id="tutorial-next" data-i18n="tutorial.next">Weiter</button>
    </div>
  </div>
</div>

<!-- JAVASCRIPT (Bleibt unverändert) -->
<script>
const SETTINGS_KEY = 'casino_settings';
const themeMap = {
  green: { felt: '#0b1b14', border: '#1f3b2c' },
  blue: { felt: '#0b1224', border: '#23345d' },
  red: { felt: '#241011', border: '#4e1b1f' }
};
const cardSizes = {
  standard: { w: '70px', h: '100px' },
  large: { w: '85px', h: '120px' },
  compact: { w: '60px', h: '85px' }
};

function applySettings() {
  const raw = localStorage.getItem(SETTINGS_KEY);
  if (!raw) return;
  try {
    const settings = JSON.parse(raw);
    const theme = themeMap[settings.theme] || themeMap.green;
    const size = cardSizes[settings.cardSize] || cardSizes.standard;
    document.documentElement.style.setProperty('--felt-color', theme.felt);
    document.documentElement.style.setProperty('--felt-border', theme.border);
    document.documentElement.style.setProperty('--card-width', size.w);
    document.documentElement.style.setProperty('--card-height', size.h);
  } catch {
    return;
  }
}

applySettings();

let currentSessionId = null;
const BET_KEY = 'blackjack_bet';

const betInput = document.getElementById('bet');
if (betInput) {
  const savedBet = localStorage.getItem(BET_KEY);
  if (savedBet) {
    betInput.value = savedBet;
  }
  betInput.addEventListener('input', () => {
    localStorage.setItem(BET_KEY, betInput.value);
  });
}

function startGame() {
  const bet = parseFloat(document.getElementById('bet').value);
  
  if (isNaN(bet) || bet <= 0) {
    const t = window.getTranslation || ((key, fallback) => fallback || key);
    alert(t('blackjack.invalidBet', 'Bitte einen gültigen Einsatz eingeben'));
    return;
  }

  localStorage.setItem(BET_KEY, bet.toString());

  const formData = new FormData();
  formData.append('bet', bet);

  fetch('/blackjack/new', { method: 'POST', body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        alert('Error: ' + data.error);
        return;
      }
      currentSessionId = data.session_id;
      updateDisplay(data);
      document.getElementById('bet-section').style.display = 'none';
      document.getElementById('game-section').style.display = 'block';
    })
    .catch(e => {
      console.error('Error:', e);
      alert('Error starting game: ' + e);
    });
}

function playerHit() {
  if (!currentSessionId) return;

  const formData = new FormData();
  formData.append('session_id', currentSessionId);

  fetch('/blackjack/hit', { method: 'POST', body: formData })
    .then(r => r.json())
    .then(data => {
      updateDisplay(data);
      if (data.finished) {
        document.getElementById('action-buttons').style.display = 'none';
        document.getElementById('play-again').style.display = 'block';
      }
    })
    .catch(e => console.error('Error:', e));
}

function playerStand() {
  if (!currentSessionId) return;

  const formData = new FormData();
  formData.append('session_id', currentSessionId);

  fetch('/blackjack/stand', { method: 'POST', body: formData })
    .then(r => r.json())
    .then(data => {
      updateDisplay(data);
      document.getElementById('action-buttons').style.display = 'none';
      document.getElementById('play-again').style.display = 'block';
    })
    .catch(e => console.error('Error:', e));
}

function updateDisplay(data) {
  function cardValue(card) {
    const rank = card.slice(0, -1);
    if (rank === 'A') return 1;
    if (['K', 'Q', 'J'].includes(rank)) return 10;
    return parseInt(rank, 10) || 0;
  }

  function handTotals(hand) {
    let total = 0;
    let aces = 0;
    hand.forEach((card) => {
      if (card === '??') return;
      if (card.startsWith('A')) aces += 1;
      total += cardValue(card);
    });
    const soft = aces > 0 && total + 10 <= 21 ? total + 10 : total;
    return { hard: total, soft };
  }

  const dealerDiv = document.getElementById('dealer-cards');
  dealerDiv.innerHTML = data.dealer_hand.map((card) => {
    if (card === '??') return '<div class="card hidden">?</div>';
    const isRed = card.includes('♥') || card.includes('♦');
    return '<div class="card' + (isRed ? ' red' : '') + '">' + card + '</div>';
  }).join('');
  document.getElementById('dealer-value').textContent = data.dealer_value;

  const playerDiv = document.getElementById('player-cards');
  playerDiv.innerHTML = data.player_hand.map(card => {
    const isRed = card.includes('♥') || card.includes('♦');
    return '<div class="card' + (isRed ? ' red' : '') + '">' + card + '</div>';
  }).join('');
  const totals = handTotals(data.player_hand || []);
  const valueText = totals.soft !== totals.hard ? `${totals.hard}/${totals.soft}` : `${totals.hard}`;
  document.getElementById('player-value').textContent = valueText;

  if (data.finished) {
    let resultText = '';
    const t = window.getTranslation || ((key, fallback) => fallback || key);
    if (data.result === 'player_bust') resultText = t('blackjack.bust', '💥 BUST! Spiel vorbei!');
    else if (data.result === 'player_win') resultText = t('blackjack.win', '🎉 DU GEWINNST!');
    else if (data.result === 'dealer_win') resultText = t('blackjack.dealerWin', '😞 Dealer gewinnt');
    else if (data.result === 'push') resultText = t('blackjack.push', '🤝 Unentschieden');
    
    document.getElementById('game-status').innerHTML = '<div class="status-badge">' + resultText + '</div>';
  }
}
</script>
<script>
  const tutorialStepsByLang = {
    en: [
      'Set your bet and press Deal to start.',
      'Hit to draw another card and improve your hand.',
      'Stand to end your turn and let the dealer play.',
      'Track your balance and results at the top.'
    ],
    de: [
      'Wähle deinen Einsatz und drücke Karten geben zum Starten.',
      'Karte zieht eine weitere Karte.',
      'Halten beendet deinen Zug und der Dealer spielt.',
      'Behalte dein Guthaben oben im Blick.'
    ]
  };
  let tutorialIndex = 0;

  const overlay = document.getElementById('tutorial-overlay');
  const tutorialBtn = document.getElementById('tutorial-btn');
  const text = document.getElementById('tutorial-text');
  const nextBtn = document.getElementById('tutorial-next');
  const closeBtn = document.getElementById('tutorial-close');
  const title = document.getElementById('tutorial-title');

  function showTutorial() {
    const t = window.getTranslation || ((key, fallback) => fallback || key);
    const lang = window.currentLang || 'en';
    const steps = tutorialStepsByLang[lang] || tutorialStepsByLang.en;
    title.textContent = t('blackjack.tutorialTitle', 'Willkommen bei Blackjack');
    text.textContent = steps[tutorialIndex];
    closeBtn.textContent = t('tutorial.close', 'Schließen');
    nextBtn.textContent = t('tutorial.next', 'Weiter');
    overlay.style.display = 'flex';
  }

  function closeTutorial() {
    overlay.style.display = 'none';
    tutorialIndex = 0;
  }

  if (tutorialBtn) {
    tutorialBtn.addEventListener('click', () => {
      tutorialIndex = 0;
      showTutorial();
    });
  }

  nextBtn.addEventListener('click', () => {
    tutorialIndex += 1;
    const lang = window.currentLang || 'en';
    const steps = tutorialStepsByLang[lang] || tutorialStepsByLang.en;
    if (tutorialIndex >= steps.length) {
      closeTutorial();
    } else {
      text.textContent = steps[tutorialIndex];
    }
  });

  closeBtn.addEventListener('click', closeTutorial);
</script>
{% endblock %}
