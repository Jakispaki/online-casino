{% extends "base.html" %}

{% block content %}
<style>
  :root {
    --felt-color: var(--green-felt);
    --felt-border: #1f3b2c;
    --chip-glow: rgba(240, 192, 97, 0.6);
  }
  .roulette-wrapper {
    max-width: 1200px;
    margin: 20px auto;
  }
  .table-area {
    margin-top: 22px;
    background: var(--felt-color);
    border: 2px solid var(--felt-border);
    border-radius: 22px;
    padding: 22px 18px 26px;
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.5), 0 15px 35px rgba(0,0,0,0.6);
  }
  .roulette-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
  }
  .wheel-container {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 0 auto;
  }
  .wheel {
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: conic-gradient(
      #1f2a49 0deg 10deg, #b31313 10deg 20deg, #121826 20deg 30deg, #b31313 30deg 40deg,
      #121826 40deg 50deg, #b31313 50deg 60deg, #121826 60deg 70deg, #b31313 70deg 80deg,
      #121826 80deg 90deg, #b31313 90deg 100deg, #121826 100deg 110deg, #b31313 110deg 120deg,
      #121826 120deg 130deg, #b31313 130deg 140deg, #121826 140deg 150deg, #b31313 150deg 160deg,
      #121826 160deg 170deg, #b31313 170deg 180deg, #121826 180deg 190deg, #b31313 190deg 200deg,
      #121826 200deg 210deg, #b31313 210deg 220deg, #121826 220deg 230deg, #b31313 230deg 240deg,
      #121826 240deg 250deg, #b31313 250deg 260deg, #121826 260deg 270deg, #b31313 270deg 280deg,
      #121826 280deg 290deg, #b31313 290deg 300deg, #121826 300deg 310deg, #b31313 310deg 320deg,
      #121826 320deg 330deg, #b31313 330deg 340deg, #121826 340deg 350deg, #b31313 350deg 360deg
    );
    border: 8px solid #111827;
    position: relative;
    transition: transform 3.5s ease-out;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
  }
  .wheel-numbers {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .wheel-number {
    position: absolute;
    width: 20px;
    height: 20px;
    font-size: 10px;
    font-weight: 700;
    color: #f8f1e1;
    text-shadow: 0 0 6px rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wheel::after {
    content: '';
    width: 14px;
    height: 14px;
    background: var(--gold);
    border-radius: 50%;
    position: absolute;
    top: -7px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 10px var(--gold);
  }
  .wheel.spinning {
    transform: rotate(var(--spin-deg));
  }
  .status-bar {
    background: rgba(11, 17, 34, 0.8);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 12px 16px;
    margin-top: 20px;
    font-weight: 600;
    color: var(--text-main);
    text-align: center;
  }
  .winning-number {
    display: inline-block;
    font-size: 26px;
    font-weight: 800;
    color: var(--gold);
    text-shadow: 0 0 15px rgba(240, 192, 97, 0.5);
    margin-left: 10px;
  }
  .table-grid {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 12px;
    margin-top: 18px;
  }
  .zero-cell {
    background: #0f3f2f;
    border: 1px solid #1f6b53;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    color: #e8f8ef;
    min-height: 264px;
    position: relative;
    cursor: pointer;
  }
  .numbers-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .bet-cell {
    background: #101826;
    border: 1px solid #1f2a49;
    border-radius: 8px;
    padding: 6px 4px;
    text-align: center;
    color: #f1f1f1;
    font-size: 12px;
    font-weight: 600;
    position: relative;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .bet-cell.red { background: #4b1111; border-color: #7a1111; }
  .bet-cell.black { background: #0e0e14; border-color: #242b3b; }
  .bet-cell.green { background: #0f3f2f; border-color: #1f6b53; }
  .bet-cell:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 12px rgba(0,0,0,0.4);
  }
  .bet-cell .bet-amount {
    position: absolute;
    bottom: 4px;
    right: 6px;
    background: var(--gold);
    color: #111;
    border-radius: 999px;
    padding: 2px 6px;
    font-size: 10px;
    display: none;
    box-shadow: 0 0 12px var(--chip-glow);
  }
  .bet-cell.placed .bet-amount { display: inline-block; }
  .bet-cell.placed { animation: chip-pop 0.2s ease; }
  .bet-cell.win {
    box-shadow: 0 0 14px rgba(240, 192, 97, 0.75);
    border-color: var(--gold);
  }
  @keyframes chip-pop {
    0% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }
  .outside-bets {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .dozen-row, .column-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .chips-bar {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    background: rgba(11, 17, 34, 0.8);
    padding: 15px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
  }
  .chips {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .chip {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: #1a1f2f;
    color: var(--gold);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(0,0,0,0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .chip.active {
    transform: translateY(-2px);
    box-shadow: 0 0 16px var(--chip-glow);
    background: var(--gold);
    color: #111;
  }
  .side-panel {
    background: rgba(11, 17, 34, 0.8);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 18px;
    margin-top: 18px;
  }
  .side-panel h4 { margin-top: 0; color: var(--gold); }
  .bet-guide-list {
    list-style: none;
    padding: 0;
    margin: 12px 0 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-main);
  }
  .bet-guide-list span { color: var(--gold); font-weight: 700; }
  .history {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .history span {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    background: #1f2a49;
  }
  .history .red { background: #7a1111; }
  .history .black { background: #121826; border: 1px solid #333; }
  .history .green { background: #1f6b53; }
  @media (min-width: 900px) {
    .roulette-grid {
      grid-template-columns: 3fr 1fr;
      align-items: start;
    }
  }
</style>

<div class="roulette-wrapper">
  <div class="roulette-grid">
    
    <!-- Linke Seite: Das Spiel -->
    <div class="table-area">
      <div class="wheel-container">
        <div class="wheel" id="wheel">
          <div class="wheel-numbers" id="wheel-numbers"></div>
        </div>
      </div>

      <div class="status-bar">
        <span data-i18n="roulette.result">Ergebnis:</span>
        <span id="result-number" class="winning-number">-</span>
        <div id="result-text" style="margin-top: 5px; font-size: 14px;"></div>
      </div>

      <div class="table-grid">
        <div class="zero-cell" data-bet="number" data-value="0" id="cell-0">0</div>
        <div class="numbers-grid" id="numbers-grid"></div>
      </div>

      <div class="dozen-row">
        <div class="bet-cell" data-bet="dozen" data-value="1st" data-i18n="roulette.dozen1">1st 12</div>
        <div class="bet-cell" data-bet="dozen" data-value="2nd" data-i18n="roulette.dozen2">2nd 12</div>
        <div class="bet-cell" data-bet="dozen" data-value="3rd" data-i18n="roulette.dozen3">3rd 12</div>
      </div>

      <div class="outside-bets">
        <div class="bet-cell" data-bet="range" data-value="low">1-18</div>
        <div class="bet-cell" data-bet="parity" data-value="even" data-i18n="roulette.even">Gerade</div>
        <div class="bet-cell red" data-bet="color" data-value="red" data-i18n="roulette.red">Rot</div>
        <div class="bet-cell black" data-bet="color" data-value="black" data-i18n="roulette.black">Schwarz</div>
        <div class="bet-cell" data-bet="parity" data-value="odd" data-i18n="roulette.odd">Ungerade</div>
        <div class="bet-cell" data-bet="range" data-value="high">19-36</div>
      </div>

      <div class="chips-bar">
        <div class="chips">
          <div class="chip active" data-amount="10">$10</div>
          <div class="chip" data-amount="50">$50</div>
          <div class="chip" data-amount="100">$100</div>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-outline" id="clear-btn" data-i18n="roulette.clear">Löschen</button>
          <button class="btn btn-primary" id="spin-btn" data-i18n="roulette.spin">Rad drehen</button>
        </div>
      </div>
    </div>

    <!-- Rechte Seite: Guide und History -->
    <div>
      <div class="side-panel">
        <h4 data-i18n="roulette.betGuide">Einsatzhilfe</h4>
        <ul class="bet-guide-list">
          <li data-i18n-html="roulette.guide1"></li>
          <li data-i18n-html="roulette.guide2"></li>
          <li data-i18n-html="roulette.guide3"></li>
          <li data-i18n-html="roulette.guide8"></li>
          <li data-i18n-html="roulette.guide9"></li>
        </ul>
      </div>

      <div class="side-panel">
        <h4 data-i18n="roulette.recent">Letzte Zahlen</h4>
        <div class="history" id="history">
          <!-- Wird per JS befüllt -->
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  // --- 1. Tableau & Rad generieren ---
  const numbersGrid = document.getElementById('numbers-grid');
  const redNumbers = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  
  for (let i = 1; i <= 36; i++) {
    const cell = document.createElement('div');
    cell.className = 'bet-cell ' + (redNumbers.has(i) ? 'red' : 'black');
    cell.textContent = i;
    cell.dataset.bet = 'number';
    cell.dataset.value = i;
    cell.id = 'cell-' + i;
    numbersGrid.appendChild(cell);
  }

  const wheelNumbers = document.getElementById('wheel-numbers');
  const radius = 100;
  const center = 120;
  for (let i = 0; i < 37; i++) {
    const num = document.createElement('div');
    num.className = 'wheel-number';
    num.textContent = i;
    const angle = (i * (360/37)) * (Math.PI / 180);
    const x = center + radius * Math.sin(angle);
    const y = center - radius * Math.cos(angle);
    num.style.left = `${x}px`;
    num.style.top = `${y}px`;
    num.style.transform = `translate(-50%, -50%) rotate(${i * (360/37)}deg)`;
    wheelNumbers.appendChild(num);
  }

  // --- 2. Spiellogik ---
  let currentChipValue = 10;
  let bets = {};
  let isSpinning = false;

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentChipValue = parseInt(chip.dataset.amount);
    });
  });

  document.querySelectorAll('[data-bet]').forEach(cell => {
    cell.addEventListener('click', () => {
      if (isSpinning) return;
      const type = cell.dataset.bet;
      const value = cell.dataset.value;
      const key = `${type}-${value}`;

      if (!bets[key]) bets[key] = { type, value, amount: 0 };
      bets[key].amount += currentChipValue;

      if (!cell.querySelector('.bet-amount')) {
        const badge = document.createElement('div');
        badge.className = 'bet-amount';
        cell.appendChild(badge);
      }
      cell.querySelector('.bet-amount').textContent = `$${bets[key].amount}`;
      cell.classList.add('placed');
    });
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    if (isSpinning) return;
    bets = {};
    document.querySelectorAll('.bet-cell, .zero-cell').forEach(c => {
      c.classList.remove('placed', 'win');
      const badge = c.querySelector('.bet-amount');
      if (badge) badge.remove();
    });
    document.getElementById('result-text').textContent = '';
    document.getElementById('result-number').textContent = '-';
  });

  // History Array
  const historyDiv = document.getElementById('history');
  let historyNumbers = [];
  function addToHistory(num) {
    historyNumbers.unshift(num);
    if (historyNumbers.length > 10) historyNumbers.pop(); // Max 10 behalten
    
    historyDiv.innerHTML = '';
    historyNumbers.forEach(n => {
      const span = document.createElement('span');
      if (n === 0) span.className = 'green';
      else if (redNumbers.has(n)) span.className = 'red';
      else span.className = 'black';
      span.textContent = n;
      historyDiv.appendChild(span);
    });
  }

  document.getElementById('spin-btn').addEventListener('click', () => {
    if (isSpinning || Object.keys(bets).length === 0) {
      if (Object.keys(bets).length === 0) alert('Bitte platziere zuerst einen Einsatz!');
      return;
    }
    isSpinning = true;
    const betsArray = Object.values(bets);
    
    fetch('/roulette/spin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bets: betsArray })
    })
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        alert(data.error);
        isSpinning = false;
        return;
      }

      const wheel = document.getElementById('wheel');
      const targetNumber = data.result_number;
      const anglePerNumber = 360 / 37;
      const targetAngle = targetNumber * anglePerNumber;
      const totalRotation = (5 + Math.floor(Math.random() * 3)) * 360 + (360 - targetAngle);
      
      wheel.style.transform = `rotate(${totalRotation}deg)`;

      setTimeout(() => {
        document.getElementById('result-number').textContent = data.result_number;
        addToHistory(data.result_number);
        
        let msg = '';
        if (data.payout > 0) {
          msg = `🎉 Gewonnen! Auszahlung: $${data.payout}`;
          document.getElementById('cell-' + targetNumber).classList.add('win');
        } else {
          msg = '😞 Verloren.';
        }
        document.getElementById('result-text').textContent = msg;

        // NEU: Navbar Guthaben sofort aktualisieren
        const navBalance = document.getElementById('nav-balance');
        if (navBalance) navBalance.textContent = `$${parseFloat(data.balance).toFixed(2)}`;

        isSpinning = false;
        bets = {};
        document.querySelectorAll('.bet-cell, .zero-cell').forEach(c => {
          c.classList.remove('placed');
          const badge = c.querySelector('.bet-amount');
          if (badge) badge.remove();
        });

      }, 3600);
    })
    .catch(e => {
      console.error(e);
      alert('Fehler beim Drehen');
      isSpinning = false;
    });
  });
</script>
{% endblock %}
