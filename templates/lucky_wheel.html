{% extends "base.html" %}

{% block content %}
<style>
  .wheel-wrapper {
    max-width: 1000px;
    margin: 40px auto;
  }
  .wheel-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 30px;
    align-items: center;
  }
  
  /* Rad-Design */
  .wheel-area {
    position: relative;
    width: 380px;
    height: 380px;
    margin: 0 auto;
  }
  .wheel-rotor {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 12px solid #111827;
    box-shadow: 0 0 50px rgba(0,0,0,0.8);
    transform: rotate(var(--spin-deg, 0deg));
    transition: transform 4s cubic-bezier(0.2, 0.7, 0.15, 1);
  }
  .wheel-labels {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }
  .wheel-label {
    position: absolute;
    font-size: 13px;
    font-weight: 800;
    color: #f7f7fb;
    text-shadow: 0 0 8px rgba(0,0,0,0.9);
  }
  .pointer {
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-bottom: 35px solid var(--gold);
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
    z-index: 3;
  }

  /* Rechtes Panel */
  .side-panel {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    text-align: center;
  }
  .side-panel h2 {
    color: var(--gold);
    font-size: 28px;
    margin-bottom: 10px;
  }
  .side-panel p {
    color: var(--text-muted);
    margin-bottom: 25px;
    font-size: 14px;
  }
  
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
    margin-bottom: 30px;
  }
  .stat-box {
    background: rgba(11, 17, 34, 0.8);
    border: 1px solid #28314e;
    padding: 15px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stat-box span:first-child {
    color: var(--text-muted);
    font-weight: 600;
  }
  .stat-box span:last-child {
    color: var(--gold);
    font-weight: 800;
    font-size: 18px;
  }

  .wheel-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }
  .cooldown {
    font-size: 13px;
    color: var(--text-main);
    background: rgba(11, 17, 34, 0.8);
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--card-border);
  }
  .reward-box {
    margin-top: 20px;
    background: rgba(11, 17, 34, 0.9);
    border: 1px solid var(--gold);
    border-radius: 12px;
    padding: 15px;
    font-weight: 700;
    font-size: 16px;
    color: var(--gold);
    box-shadow: 0 0 20px rgba(240, 192, 97, 0.2);
    min-height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @media (min-width: 900px) {
    .wheel-layout {
      grid-template-columns: 1fr 1fr;
    }
  }
</style>

<div class="wheel-wrapper">
  <div class="wheel-layout">
    
    <!-- Linke Seite: Das Rad -->
    <div class="wheel-area">
      <div class="pointer"></div>
      <div class="wheel-rotor" id="wheel-rotor">
        <div class="wheel-labels" id="wheel-labels"></div>
      </div>
    </div>

    <!-- Rechte Seite: Info & Steuerung -->
    <div class="side-panel">
      <h2 class="brand-font" data-i18n="wheel.title">Lucky Wheel</h2>
      <p data-i18n="wheel.subtitle">Ein Gratis-Dreh pro Tag. Weitere Drehungen kosten $100.</p>

      <div class="stats-grid">
        <div class="stat-box">
          <span data-i18n="ui.balance">Guthaben</span>
          <span id="local-balance">${{ "%.2f"|format(global_balance) }}</span>
        </div>
        <div class="stat-box">
          <span data-i18n="wheel.xp">XP</span>
          <span id="xp">{{ xp }}</span>
        </div>
        <div class="stat-box">
          <span data-i18n="wheel.level">Level</span>
          <span id="level">{{ level }}</span>
        </div>
      </div>

      <div class="wheel-actions">
        <button id="spin-btn" class="btn btn-primary" style="font-size: 20px; padding: 15px 40px; width: 100%; letter-spacing: 2px;" data-i18n="wheel.spin">SPIN</button>
        <div class="cooldown" id="cooldown"></div>
      </div>

      <div class="reward-box" id="reward-box" data-i18n="wheel.rewardPrompt">Drehe das Rad, um deine Belohnung zu sehen.</div>
    </div>

  </div>
</div>

<script type="application/json" id="wheel-data">
  {{ {
    'segments': segments,
    'freeAvailable': free_available,
    'nextFreeSeconds': next_free_seconds
  } | tojson }}
</script>

<script>
  const wheelData = JSON.parse(document.getElementById('wheel-data').textContent || '{}');
  const segments = Array.isArray(wheelData.segments) ? wheelData.segments : [];
  let freeAvailable = Boolean(wheelData.freeAvailable);
  let nextFreeSeconds = Number(wheelData.nextFreeSeconds) || 0;
  let currentRotation = 0;
  let spinning = false;

  const wheelRotor = document.getElementById('wheel-rotor');
  const wheelLabels = document.getElementById('wheel-labels');
  const spinBtn = document.getElementById('spin-btn');
  const rewardBox = document.getElementById('reward-box');
  const cooldown = document.getElementById('cooldown');

  function t(key, fallback) {
    if (window.getTranslation) {
      return window.getTranslation(key, fallback);
    }
    return fallback || key;
  }

  function formatTime(seconds) {
    const s = Math.max(0, seconds);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
  }

  function updateCooldown() {
    if (freeAvailable) {
      cooldown.textContent = t('wheel.freeAvailable', 'Gratis-Dreh verfügbar');
    } else {
      const text = t('wheel.nextFree', 'Nächster Gratis-Dreh in {time}').replace('{time}', formatTime(nextFreeSeconds));
      cooldown.textContent = `${text} · ${t('wheel.paidCost', 'Kosten pro Dreh: 100 $')}`;
    }
  }

  function applyWheelTranslations() {
    updateCooldown();
    renderWheel();
  }

  function renderWheel() {
    if (!Array.isArray(segments) || segments.length === 0) {
      wheelRotor.style.background = '#1f2937';
      wheelLabels.innerHTML = '';
      if (!spinning) spinBtn.disabled = true;
      return;
    }
    if (!spinning) spinBtn.disabled = false;
    
    const step = 360 / segments.length;
    const gradient = segments.map((seg, i) => `${seg.color} ${i * step}deg ${(i + 1) * step}deg`).join(',');
    wheelRotor.style.background = `conic-gradient(${gradient})`;

    wheelLabels.innerHTML = '';
    const radius = wheelLabels.clientWidth / 2 - 40;
    const center = wheelLabels.clientWidth / 2;

    segments.forEach((seg, i) => {
      const label = document.createElement('div');
      label.className = 'wheel-label';
      label.textContent = t(seg.label_key, seg.label);
      const angle = (i + 0.5) * step;
      const rad = (angle * Math.PI) / 180;
      const x = center + radius * Math.cos(rad);
      const y = center + radius * Math.sin(rad);
      label.style.left = `${x}px`;
      label.style.top = `${y}px`;
      label.style.transform = 'translate(-50%, -50%)';
      wheelLabels.appendChild(label);
    });
  }

  function spinTo(index) {
    const step = 360 / segments.length;
    const spins = 5;
    const centerAngle = (index * step) + (step / 2);
    const desired = (270 - centerAngle + 360) % 360;
    const current = ((currentRotation % 360) + 360) % 360;
    const delta = (desired - current + 360) % 360;
    currentRotation += (360 * spins) + delta;
    wheelRotor.style.setProperty('--spin-deg', `${currentRotation}deg`);
  }

  function showReward(type, value) {
    if (type === 'money') {
      const amountText = `$${value}`;
      rewardBox.textContent = t('wheel.rewardMoney', 'Du gewinnst {amount}!').replace('{amount}', amountText);
      rewardBox.style.color = 'var(--success)';
    } else if (type === 'xp') {
      rewardBox.textContent = t('wheel.rewardXp', 'Du erhältst {amount} XP!').replace('{amount}', value);
      rewardBox.style.color = '#4299e1';
    } else {
      rewardBox.textContent = t('wheel.rewardNone', 'Diesmal kein Gewinn.');
      rewardBox.style.color = 'var(--text-muted)';
    }
  }

  spinBtn.addEventListener('click', () => {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    rewardBox.textContent = '...';
    rewardBox.style.color = 'var(--gold)';

    fetch('/lucky-wheel/spin', { method: 'POST' })
      .then((res) => res.json().then((data) => ({ status: res.status, data })))
      .then(({ status, data }) => {
        if (!data.ok) {
          const msg = data.error_key ? t(data.error_key, 'Nicht genug Guthaben für einen bezahlten Dreh.') : t('wheel.spinFailed', 'Dreh fehlgeschlagen.');
          rewardBox.textContent = msg;
          rewardBox.style.color = 'var(--danger)';
          spinBtn.disabled = false;
          spinning = false;
          return;
        }

        spinTo(data.segment_index);
        
        const finishSpin = () => {
          if (!spinning) return;
          showReward(data.reward_type, data.reward_value);
          
          // Update im Seitenpanel
          document.getElementById('xp').textContent = data.xp;
          document.getElementById('level').textContent = data.level;
          document.getElementById('local-balance').textContent = `$${parseFloat(data.balance).toFixed(2)}`;
          
          // NEU: Update in der oberen Navbar!
          const navBalance = document.getElementById('nav-balance');
          if (navBalance) {
            navBalance.textContent = `$${parseFloat(data.balance).toFixed(2)}`;
          }

          freeAvailable = data.free_available;
          nextFreeSeconds = data.next_free_seconds;
          updateCooldown();
          spinBtn.disabled = false;
          spinning = false;
        };
        
        const onDone = () => {
          wheelRotor.removeEventListener('transitionend', onDone);
          finishSpin();
        };
        wheelRotor.addEventListener('transitionend', onDone);
        setTimeout(finishSpin, 4300);
      })
      .catch(() => {
        rewardBox.textContent = t('wheel.spinFailed', 'Dreh fehlgeschlagen.');
        rewardBox.style.color = 'var(--danger)';
        spinBtn.disabled = false;
        spinning = false;
      });
  });

  applyWheelTranslations();
  document.addEventListener('languageChanged', applyWheelTranslations);

  setInterval(() => {
    if (!freeAvailable && nextFreeSeconds > 0) {
      nextFreeSeconds -= 1;
      updateCooldown();
    }
  }, 1000);
</script>
{% endblock %}
